<body><header class="cab" id="cab"></header><main>
<h1 class="t">Checkout</h1><div class="dos"><div><section id="p1"><h2>1. Envío</h2><label>Nombre (ficticio)<input id="nombre" maxlength="40" placeholder="Ej: Cliente de prueba"></label><label>País<select id="pais"></select></label><fieldset><legend>Servicio</legend><label class="r"><input type="radio" name="srv" value="e" checked>Estándar</label><label class="r"><input type="radio" name="srv" value="x">Express</label></fieldset><p id="tarifa" class="g"></p><p class="aviso">Usa un nombre inventado. No pedimos correo, teléfono ni documento.</p><p id="err" class="err"></p><button class="btn" id="b1" type="button">Continuar al pago</button></section><section id="p2" hidden><h2>2. Pago simulado</h2><fieldset><legend>Método de pago</legend><label class="r"><input type="radio" name="pago" value="Tarjeta de crédito" checked>Tarjeta de crédito</label><label class="r"><input type="radio" name="pago" value="PSE">PSE</label><label class="r"><input type="radio" name="pago" value="Nequi">Nequi</label><label class="r"><input type="radio" name="pago" value="PayPal">PayPal</label></fieldset><p class="aviso">Simulación: no se ingresan datos de tarjeta ni se cobra nada.</p><button class="btn" id="b2" type="button">Pagar (simulado)</button></section></div><aside class="resumen" id="res"></aside></div>
</main><footer class="pie" id="pie"></footer>
